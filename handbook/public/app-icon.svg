<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft light shadow filter matching editorial clean design -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#33302e" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#33302e" flood-opacity="0.08"/>
    </filter>
    <filter id="inner-card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#33302e" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Base Canvas (Single Color match: #fff1e5) -->
  <rect width="512" height="512" rx="100" fill="#fff1e5"/>

  <!-- Inner Surface Card with Light Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="72" fill="#fff9f4" stroke="#d9cfc7" stroke-width="2" filter="url(#soft-shadow)"/>

  <!-- Subtle Editorial Top Accent Bar in Burgundy/Claret (#990f3d) -->
  <rect x="206" y="80" width="100" height="6" rx="3" fill="#990f3d" opacity="0.9"/>

  <!-- "Java" typography in the center -->
  <!-- Serif Editorial Display Font Styling -->
  <g id="java-text">
    <text 
      x="256" 
      y="275" 
      text-anchor="middle" 
      dominant-baseline="central"
      font-family="'Playfair Display', 'Source Serif 4', 'Georgia', serif" 
      font-size="126" 
      font-weight="700" 
      letter-spacing="-2"
      fill="#33302e"
    >Java</text>
    
    <!-- Red Accent Dot on 'J' or below -->
    <circle cx="256" cy="352" r="7" fill="#990f3d"/>
    <line x1="176" y1="352" x2="236" y2="352" stroke="#d9cfc7" stroke-width="2" stroke-linecap="round"/>
    <line x1="276" y1="352" x2="336" y2="352" stroke="#d9cfc7" stroke-width="2" stroke-linecap="round"/>

    <!-- Subtitle tag 150 -->
    <text 
      x="256" 
      y="390" 
      text-anchor="middle" 
      font-family="'JetBrains Mono', 'IBM Plex Sans', monospace" 
      font-size="22" 
      font-weight="600" 
      letter-spacing="6"
      fill="#807973"
    >HANDBOOK</text>
  </g>
</svg>
